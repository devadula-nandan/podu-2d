name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ strips TypeScript natively, which tools/validate.mjs relies on to
          # import the zod schemas rather than re-implementing the invariants.
          node-version: '22.18'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate content data
        run: npm run data:validate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
